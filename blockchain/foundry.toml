[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Solidity compiler settings
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Test settings
verbosity = 3
fuzz_runs = 256
fuzz_max_local_rejects = 65536
fuzz_max_global_rejects = 100000

# Gas reports
gas_reports = ["ClearingHouse"]

# RPC endpoints (for forking tests if needed)
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

# Etherscan API key for contract verification
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
