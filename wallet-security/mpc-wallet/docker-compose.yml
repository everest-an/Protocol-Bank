version: '3.8'

services:
  # MPC 节点 1
  mpc-node-1:
    build: .
    container_name: mpc-wallet-node-1
    hostname: node1
    environment:
      - NODE_ID=node1
      - PARTY_ID=0
      - RUST_LOG=info
    volumes:
      - ./config/node1.toml:/config/config.toml:ro
      - node1-data:/data
      - node1-logs:/logs
    ports:
      - "50051:50051"
    networks:
      - mpc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/mpc_wallet", "health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MPC 节点 2
  mpc-node-2:
    build: .
    container_name: mpc-wallet-node-2
    hostname: node2
    environment:
      - NODE_ID=node2
      - PARTY_ID=1
      - RUST_LOG=info
    volumes:
      - ./config/node2.toml:/config/config.toml:ro
      - node2-data:/data
      - node2-logs:/logs
    ports:
      - "50052:50051"
    networks:
      - mpc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/mpc_wallet", "health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: mpc-wallet-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mpc-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: mpc-wallet-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - mpc-network
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

networks:
  mpc-network:
    driver: bridge

volumes:
  node1-data:
  node1-logs:
  node2-data:
  node2-logs:
  prometheus-data:
  grafana-data:
