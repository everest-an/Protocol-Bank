[package]
name = "mpc_wallet"
version = "1.0.0"
edition = "2021"
authors = ["Protocol Bank Team"]
description = "Production-grade MPC wallet infrastructure with post-quantum encryption"

[dependencies]
# MPC 核心库 - ZenGo 的 multi-party-ecdsa
multi-party-ecdsa = { git = "https://github.com/ZenGo-X/multi-party-ecdsa", branch = "master" }

# 加密库
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 后量子加密 - Kyber
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"

# 异步运行时（用于网络通信）
tokio = { version = "1", features = ["full"] }

# 日志
env_logger = "0.11"
log = "0.4"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 安全内存管理
zeroize = { version = "1.7", features = ["derive"] }

# 密钥派生函数 (KDF)
hkdf = "0.12"

# 数字签名（用于授权令牌）
ed25519-dalek = { version = "2.1", features = ["serde"] }

# 并发锁
parking_lot = "0.12"

# 嵌入式数据库（审计日志和状态）
sled = "0.34"

# gRPC 和网络
tonic = "0.11"
prost = "0.12"
rustls = "0.22"
tokio-rustls = "0.25"

# 日志系统
tracing = "0.1"
tracing-subscriber = "0.3"

# 配置管理
toml = "0.8"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.8"
