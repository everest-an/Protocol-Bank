[package]
name = "mpc-example"
version = "1.0.0"
edition = "2021"

[dependencies]
# MPC 核心库
multi-party-ecdsa = { git = "https://github.com/ZenGo-X/multi-party-ecdsa", branch = "master" }
curv-kzen = { version = "0.9", default-features = false }

# 错误处理
anyhow = "1.0"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 加密
sha2 = "0.10"
